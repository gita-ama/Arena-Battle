<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Battle 2.5D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <h1>⚔️ ARENA BATTLE 2.5D ⚔️</h1>
        <button onclick="startGame('computer')">🎮 1 Pemain vs Komputer</button>
        <button onclick="startGame('dua')">👥 2 Pemain</button>
        <select id="level">
            <option value="1">Level 1 - Mudah</option>
            <option value="2">Level 2 - Sedang</option>
            <option value="3">Level 3 - Sulit</option>
        </select>
    </div>

    <div id="info">
        <div>⏱️ Waktu: <span id="timer">60</span>s</div>
        <div>⭐ Level: <span id="levelInfo">1</span></div>
        <div>🔴 Pemain 1: <span id="skor1">0</span></div>
        <div>🔵 <span id="labelP2">Musuh: <span id="skor2">0</span></span></div>
        <button onclick="pauseGame()">⏸️</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div id="pesan"></div>

    <script src="script.js"></script>
</body>
</html>
