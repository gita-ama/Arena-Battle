<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ GLADIATOR ARENA: ULTIMATE BATTLE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            overflow: hidden;
            background: #000;
            color: white;
        }

        /* === LOGO DI ATAS MENU (DIPERBAIKI AGAR TIDAK HILANG) === */
        .logo-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 15px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.4);
            position: relative;
            z-index: 20;
        }
        .logo-bar img {
            height: 55px;
            width: auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255,215,0,0.4);
            transition: transform 0.3s;
        }
        .logo-bar img:hover {
            transform: scale(1.08);
        }

        /* === MENU UTAMA === */
        #menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 30, 0.94);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 15;
            border: 3px solid #ffd700;
            box-shadow: 0 0 50px #ffd70060, inset 0 0 40px rgba(255,215,0,0.15);
            width: 92%;
            max-width: 480px;
            backdrop-filter: blur(8px);
        }

        #menu h1 {
            color: #ffd700;
            font-size: 2.4rem;
            margin-bottom: 12px;
            text-shadow: 0 0 15px #ffd700, 0 0 30px #ff6b00;
            letter-spacing: 2px;
        }
        .sub {
            color: #ffcc80;
            margin-bottom: 35px;
            letter-spacing: 4px;
            font-weight: 500;
        }

        button, select {
            width: 100%;
            padding: 15px;
            margin: 14px 0;
            border: none;
            border-radius: 12px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #menu button {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border-bottom: 5px solid #922b21;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        #menu button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(231, 76, 60, 0.5);
        }

        .pilih {
            margin-top: 25px;
            text-align: left;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
        }
        select {
            background: #2c3e50;
            color: white;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* === PANEL INFO ATAS === */
        #panelInfo {
            position: absolute;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 14px 30px;
            border-radius: 15px;
            display: flex;
            gap: 25px;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .info-box {
            font-weight: bold;
            font-size: 17px;
            text-shadow: 0 0 8px currentColor;
        }
        .merah { color: #ff6b6b; }
        .biru { color: #4dabf7; }
        #tombolJeda {
            width: auto;
            padding: 8px 18px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            margin: 0;
            border-radius: 8px;
            font-size: 16px;
        }

        /* === AREA KANVAS & LATAR BELAKANG === */
        canvas {
            display: block;
            background: url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?fit=crop&w=1920&q=85');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* === OVERLAY GELAP === */
        .overlay-latar {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.35) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* === LAYAR PESAN AKHIR === */
        #kotakPesan {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92);
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 20;
            border: 3px solid gold;
            box-shadow: 0 0 60px gold, inset 0 0 30px rgba(255,215,0,0.1);
        }
        #kotakPesan h2 {
            color: gold;
            margin-bottom: 30px;
            font-size: 2.4rem;
            text-shadow: 0 0 15px gold;
        }
        #kotakPesan button {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            width: auto;
            padding: 15px 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(39, 174, 96, 0.4);
        }
    </style>
</head>
<body>

    <!-- Logo Bar - TETAP ADA & AMAN -->
    <div class="logo-bar" id="logoTampil">
        <img src="https://raw.githubusercontent.com/gita-ama/Arena-Battle/1fe8704711c5dc039652d7c8f8f9ad7c8b5b0181/logo_ones.jpeg" alt="Logo Ones">
        <img src="https://raw.githubusercontent.com/gita-ama/Arena-Battle/1fe8704711c5dc039652d7c8f8f9ad7c8b5b0181/logo_pakmoko.jpeg" alt="Logo Pakmoko">
        <img src="https://raw.githubusercontent.com/gita-ama/Arena-Battle/1fe8704711c5dc039652d7c8f8f9ad7c8b5b0181/logo_rpl.jpeg" alt="Logo RPL">
        <img src="https://raw.githubusercontent.com/gita-ama/Arena-Battle/1fe8704711c5dc039652d7c8f8f9ad7c8b5b0181/logosmk.jpeg" alt="Logo SMK">
    </div>

    <!-- Layar Menu Utama -->
    <div id="menu">
        <h1>⚔️ GLADIATOR ARENA ⚔️</h1>
        <p class="sub">PERTARUNGAN TAK TERBATAS</p>
        
        <button onclick="mulaiGame('komputer')">🎮 LAWAN KOMPUTER</button>
        <button onclick="mulaiGame('berdua')">👥 MAIN BERDUA</button>

        <div class="pilih">
            <label>Pilih Level Kesulitan:</label>
            <select id="pilihLevel">
                <option value="1">🟢 Pemula</option>
                <option value="2" selected>🟡 Petarung</option>
                <option value="3">🔴 Legenda</option>
            </select>
        </div>
    </div>

    <!-- Panel Info Atas -->
    <div id="panelInfo">
        <div class="info-box">⏱️ Waktu: <span id="waktu">60</span>s</div>
        <div class="info-box">⭐ Level: <span id="levelTampil">2</span></div>
        <div class="info-box merah">🔴 Pemain 1: <span id="skorP1">0</span></div>
        <div class="info-box biru">🔵 <span id="labelMusuh">Musuh: <span id="skorP2">0</span></span></div>
        <button id="tombolJeda" onclick="jedaGame()">⏸️</button>
    </div>

    <!-- Area Permainan & Latar -->
    <div class="overlay-latar"></div>
    <canvas id="areaGame"></canvas>

    <!-- Pesan Akhir -->
    <div id="kotakPesan">
        <h2 id="teksPesan"></h2>
        <button onclick="location.reload()">🔄 Main Lagi</button>
    </div>

    <script>
    // === SETUP KANVAS ===
    const canvas = document.getElementById('areaGame');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

    function aturUkuran() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.imageSmoothingEnabled = false;
    }
    aturUkuran();
    window.addEventListener('resize', aturUkuran);

    // === SUARA & AUDIO ===
    const sfx = {
        hit: new Audio('assets/sounds/hit.mp3'),
        skor: new Audio('assets/sounds/score.mp3'),
        selesai: new Audio('assets/sounds/gameover.mp3')
    };
    Object.values(sfx).forEach(a => { a.load(); a.volume = 0.8; });

    // === VARIABEL UTAMA ===
    let modeMain, levelGame, waktuMain = 60, gameJalan = false;
    const kunci = {};
    let putaranAnimasi = 0; // Untuk gerakan kaki karakter

    // === OBJEK PEMAIN & BOLA ===
    const p1 = {
        x: 120, y: canvas.height/2 - 80, w: 90, h: 140,
        skor: 0, kecepatan: 6, warna: '#ff4757', warnaBaju: '#d63031', sedangBergerak: false
    };
    const p2 = {
        x: canvas.width - 210, y: canvas.height/2 - 80, w: 90, h: 140,
        skor: 0, kecepatan: 6, warna: '#3742fa', warnaBaju: '#1e3799', sedangBergerak: false
    };
    const bola = {
        x: canvas.width/2, y: canvas.height/2, r: 25,
        vx: 7, vy: 4, rotasi: 0
    };

    // === KONTROL KEYBOARD ===
    document.addEventListener('keydown', e => kunci[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', e => kunci[e.key.toLowerCase()] = false);

    // === MULAI GAME (PERBAIKAN: LOGO TIDAK HILANG TOTAL, HANYA DIATUR VISUALNYA) ===
    function mulaiGame(mode) {
        modeMain = mode;
        levelGame = parseInt(document.getElementById('pilihLevel').value);
        document.getElementById('menu').style.display = 'none';
        document.getElementById('logoTampil').style.opacity = '0.3'; // Logo tetap ada tapi transparan saat main
        document.getElementById('levelTampil').innerText = levelGame;
        if (mode === 'berdua') document.getElementById('labelMusuh').innerText = 'Pemain 2: ';
        
        gameJalan = true;
        mulaiHitungMundur();
        requestAnimationFrame(lingkaranGame);
    }

    // === SISTEM WAKTU ===
    function mulaiHitungMundur() {
        let timer = setInterval(() => {
            if (!gameJalan) return clearInterval(timer);
            waktuMain--;
            document.getElementById('waktu').innerText = waktuMain;
            if (waktuMain <= 0) {
                akhirGame();
                clearInterval(timer);
            }
        }, 1000);
    }

    // === 🎨 GAMBAR KARAKTER ORANG/GLADIATOR LUCU & DINAMIS 🎨 ===
    function gambarPetarungAnimasi(p, menghadapKanan) {
        ctx.save();
        
        // Efek ayunan kaki berbasis waktu gerakan
        let ayunanKaki = p.sedangBergerak ? Math.sin(putaranAnimasi * 0.15) * 15 : 0;
        let ayunanNafas = Math.sin(putaranAnimasi * 0.05) * 3; // Efek naik-turun nafas saat diam

        // 1. Bayangan di Bawah Karakter
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(p.x + p.w/2, p.y + p.h + 10, p.w/2 - 5, 12, 0, 0, Math.PI*2);
        ctx.fill();

        // 2. Kaki Kiri dan Kanan (Berayun bergantian saat berjalan)
        ctx.fillStyle = '#2d3436';
        ctx.fillRect(p.x + p.w/3 - 8, p.y + p.h - 5 + (ayunanKaki > 0 ? ayunanKaki : 0), 16, 20);
        ctx.fillRect(p.x + (p.w/3)*2 - 8, p.y + p.h - 5 + (ayunanKaki < 0 ? -ayunanKaki : 0), 16, 20);

        // 3. Tubuh/Baju Zirah Petarung (Bulat & Lucu)
        let grad = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y);
        grad.addColorStop(0, p.warna);
        grad.addColorStop(1, p.warnaBaju);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y + ayunanNafas, p.w, p.h - 10, 25);
        ctx.fill();

        // 4. Kepala Bulat Kulit
        ctx.fillStyle = '#ffeaa7';
        ctx.beginPath();
        ctx.arc(p.x + p.w/2, p.y - 20 + ayunanNafas, 35, 0, Math.PI*2);
        ctx.fill();

        // 5. Helm Emas Gladiator
        ctx.fillStyle = '#fdcb6e';
        ctx.beginPath();
        ctx.arc(p.x + p.w/2, p.y - 28 + ayunanNafas, 37, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#d63031'; // Jambul Merah
        ctx.beginPath();
        ctx.arc(p.x + p.w/2, p.y - 65 + ayunanNafas, 12, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(p.x + p.w/2 - 4, p.y - 60 + ayunanNafas, 8, 25);

        // 6. Mata Berkedip
        ctx.fillStyle = '#2d3436';
        let mataTinggi = Math.sin(putaranAnimasi * 0.02) > 0.95 ? 1 : 10;
        if (menghadapKanan) {
            ctx.beginPath();
            ctx.ellipse(p.x + p.w/2 + 10, p.y - 20 + ayunanNafas, 4, mataTinggi/2, 0, 0, Math.PI*2);
            ctx.ellipse(p.x + p.w/2 + 25, p.y - 20 + ayunanNafas, 4, mataTinggi/2, 0, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.ellipse(p.x + p.w/2 - 10, p.y - 20 + ayunanNafas, 4, mataTinggi/2, 0, 0, Math.PI*2);
            ctx.ellipse(p.x + p.w/2 - 25, p.y - 20 + ayunanNafas, 4, mataTinggi/2, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // 7. Pipi Merona
        ctx.fillStyle = 'rgba(255, 118, 117, 0.6)';
        if (menghadapKanan) {
            ctx.beginPath();
            ctx.arc(p.x + p.w/2 + 8, p.y - 10 + ayunanNafas, 6, 0, Math.PI*2);
            ctx.arc(p.x + p.w/2 + 27, p.y - 10 + ayunanNafas, 6, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(p.x + p.w/2 - 8, p.y - 10 + ayunanNafas, 6, 0, Math.PI*2);
            ctx.arc(p.x + p.w/2 - 27, p.y - 10 + ayunanNafas, 6, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.restore();
    }

    // === GAMBAR BOLA (ANTI GETAR) ===
    function gambarBolaUtama() {
        ctx.save();
        ctx.translate(Math.round(bola.x), Math.round(bola.y));
        bola.rotasi += bola.vx * 0.05;
        ctx.rotate(bola.rotasi);

        let grad = ctx.createRadialGradient(-8, -8, 5, 0, 0, bola.r);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.3, '#ffd700');
        grad.addColorStop(1, '#ff9500');
        ctx.fillStyle = grad;

        ctx.beginPath();
        ctx.arc(0, 0, bola.r, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    // === LOGIKA TABRAKAN ===
    function cekTabrak(rect, lingkaran) {
        let terdekatX = Math.max(rect.x, Math.min(lingkaran.x, rect.x + rect.w));
        let terdekatY = Math.max(rect.y, Math.min(lingkaran.y, rect.y + rect.h));
        let jarakX = lingkaran.x - terdekatX;
        let jarakY = lingkaran.y - terdekatY;
        return (jarakX*jarakX + jarakY*jarakY) < (lingkaran.r*lingkaran.r);
    }

    // === KOMPUTER AI ===
    function gerakKomputerPintar() {
        let reaksi = 2 + levelGame;
        let bergerak = false;
        if (bola.x > p2.x + p2.w/2) { p2.x += reaksi; bergerak = true; }
        else if (bola.x < p2.x + p2.w/2) { p2.x -= reaksi; bergerak = true; }

        if (bola.y > p2.y + p2.h/2) { p2.y += reaksi * 0.8; bergerak = true; }
        else if (bola.y < p2.y + p2.h/2) { p2.y -= reaksi * 0.8; bergerak = true; }
        p2.sedangBergerak = bergerak;
    }

    // === KONTROL PEMAIN ===
    function gerakanPemain() {
        let p1Gerak = false;
        if (kunci['w'] && p1.y > 80) { p1.y -= p1.kecepatan; p1Gerak = true; }
        if (kunci['s'] && p1.y < canvas.height - p1.h - 20) { p1.y += p1.kecepatan; p1Gerak = true; }
        if (kunci['a'] && p1.x > 10) { p1.x -= p1.kecepatan; p1Gerak = true; }
        if (kunci['d'] && p1.x < canvas.width/2 - p1.w - 50) { p1.x += p1.kecepatan; p1Gerak = true; }

        if (modeMain === 'berdua') {
            let p2Gerak = false;
            if (kunci['arrowup'] && p2.y > 80) { p2.y -= p2.kecepatan; p2Gerak = true; }
            if (kunci['arrowdown'] && p2.y < canvas.height - p2.h - 20) { p2.y += p2.kecepatan; p2Gerak = true; }
            if (kunci['arrowleft'] && p2.x > canvas.width/2 + 50) { p2.x -= p2.kecepatan; p2Gerak = true; }
            if (kunci['arrowright'] && p2.x < canvas.width - p2.w - 10) { p2.x += p2.kecepatan; p2Gerak = true; }
            p2.sedangBergerak = p2Gerak;
        }
        p1.sedangBergerak = p1Gerak;
    }

    // === UPDATE POSISI ===
    function perbaruiSemua() {
        putaranAnimasi++; // Tambah waktu untuk animasi halus
        bola.x += bola.vx;
        bola.y += bola.vy;

        // Pantulan dinding dikunci
        if (bola.y - bola.r < 0) { bola.y = bola.r; bola.vy *= -1; }
        if (bola.y + bola.r > canvas.height) { bola.y = canvas.height - bola.r; bola.vy *= -1; }

        // Gol
        if (bola.x < -10) { p2.skor++; resetBola(); }
        if (bola.x > canvas.width + 10) { p1.skor++; resetBola(); }

        // Tabrakan & Cegah Bola Menempel
        if (cekTabrak(p1, bola) || cekTabrak(p2, bola)) {
            bola.vx *= -1.08;
            bola.x += bola.vx * 2; // Dorong keluar
            sfx.hit.play().catch(()=>{});
        }

        if (modeMain === 'komputer') gerakKomputerPintar();
        gerakanPemain();

        document.getElementById('skorP1').innerText = p1.skor;
        document.getElementById('skorP2').innerText = p2.skor;
    }

    // === KEMBALIKAN BOLA ===
    function resetBola() {
        bola.x = canvas.width/2;
        bola.y = canvas.height/2;
        bola.vx = (Math.random() > 0.5 ? 1 : -1) * (5 + levelGame);
        bola.vy = (Math.random() - 0.5) * 6;
        sfx.skor.play().catch(()=>{});
    }

    // === SELESAI ===
    function akhirGame() {
        gameJalan = false;
        sfx.selesai.play().catch(()=>{});
        let pemenang = '';
        if (p1.skor > p2.skor) pemenang = '🏆 PEMAIN 1 MENANG!';
        else if (p2.skor > p1.skor) pemenang = '🏆 PEMAIN 2 / MUSUH MENANG!';
        else pemenang = '⚔️ PERTANDINGAN SERI!';

        document.getElementById('teksPesan').innerText = pemenang;
        document.getElementById('kotakPesan').style.display = 'block';
    }

    // === JEDA ===
    function jedaGame() {
        gameJalan = !gameJalan;
        if (gameJalan) requestAnimationFrame(lingkaranGame);
    }

    // === LOOP UTAMA ===
    function lingkaranGame() {
        if (!gameJalan) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.setLineDash([20, 20]);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, 0);
        ctx.lineTo(canvas.width/2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        gambarPetarungAnimasi(p1, true);  // P1 menghadap kanan
        gambarPetarungAnimasi(p2, false); // P2 menghadap kiri
        gambarBolaUtama();
        perbaruiSemua();

        requestAnimationFrame(lingkaranGame);
    }
    </script>

</body>
</html>
